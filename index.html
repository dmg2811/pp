<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slideshow Vertical para TV</title>

    <style>
        html, body {
            margin: 0; padding: 0;
            overflow: hidden; background-color: #000;
        }

        body {
            width: 100vh; height: 100vw;
            position: absolute; top: 50%; left: 50%;
            transition: transform 0.5s ease-in-out;
            transform: translate(-50%, -50%) rotate(90deg);
            transform-origin: center center;
            display: flex; justify-content: center; align-items: center;
        }

        #slideshow-container { width: 100%; height: 100%; position: relative; }

        .slide {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            transition: opacity 1s ease-in-out, transform 1s ease-in-out;
            object-fit: contain; object-position: center;
            opacity: 0; transform: scale(1.0); background: #000;
        }

        .slide.active { opacity: 1; transform: scale(1.04); }

        #overlayText {
            position: absolute; bottom: 3%; left: 50%;
            transform: translateX(-50%);
            color: white; text-align: center;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
            font-size: 3vh; font-family: sans-serif;
            z-index: 10; padding: 10px;
        }

        #controls {
            position: absolute; top: 2%; right: 2%;
            z-index: 60; display: flex; gap: 8px;
            opacity: 0; transition: opacity 0.35s ease;
            pointer-events: none;
        }
        #controls.visible { opacity: 1; pointer-events: auto; }

        .control-btn {
            padding: 10px 14px; border-radius: 8px; border: none;
            background: rgba(255,255,255,0.15); color: #fff;
            font-size: 2vh; backdrop-filter: blur(4px); cursor: pointer;
        }

        /* Indicador de estado de conexión */
        #syncIndicator {
            position: absolute; bottom: 2%; right: 2%;
            z-index: 60; font-size: 1.4vh; color: rgba(255,255,255,0.5);
            font-family: sans-serif;
        }

        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div id="slideshow-container">
        <img id="slide1" class="slide active" alt="Slide 1">
        <img id="slide2" class="slide" alt="Slide 2">
        <div id="overlayText"></div>
    </div>

    <div id="controls" aria-hidden="true">
        <button id="btnPrev" class="control-btn">⏮ Anterior</button>
        <button id="btnPause" class="control-btn">⏸ Pausar</button>
        <button id="btnNext" class="control-btn">Siguiente ⏭</button>
        <button id="btnRotate" class="control-btn">🔄 Girar 180°</button>
        <button id="btnFull" class="control-btn">Pantalla completa</button>
    </div>

    <div id="syncIndicator"></div>

    <script>
        // ==========================================
        // CONFIGURACIÓN
        // ==========================================

        // URL del data.json en GitHub Pages del slider
        const DATA_URL = 'https://dmg2811.github.io/pp/data.json';

        // Cada cuánto refrescar los datos desde GitHub (ms)
        const REFRESH_INTERVAL = 5 * 60 * 1000; // 5 minutos

        const SLIDE_DURATION = 6000;

        // ==========================================
        // ESTADO
        // ==========================================
        let images = [];
        let imageIndex = 0;
        let isPaused = false;
        let isRotated = false;
        let slideshowTimer = null;
        let refreshTimer = null;

        const slide1 = document.getElementById('slide1');
        const slide2 = document.getElementById('slide2');
        const overlayText = document.getElementById('overlayText');
        const controls = document.getElementById('controls');
        const syncIndicator = document.getElementById('syncIndicator');

        let currentSlide = slide1;
        let nextSlide = slide2;

        // ==========================================
        // CARGA DE DATOS
        // ==========================================

        // Carga desde GitHub Pages (fuente principal)
        async function loadDataFromGitHub() {
            try {
                // Cache-buster para evitar que el navegador use versión vieja
                const res = await fetch(DATA_URL + '?t=' + Date.now());
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                images = data.filter(item => item.visible !== false);
                setSyncStatus('🟢 GitHub Pages');
                return true;
            } catch (e) {
                setSyncStatus('🔴 Sin conexión');
                return false;
            }
        }

        // Fallback: leer del localStorage (mismo dominio, uso local)
        function loadDataFromLocalStorage() {
            const raw = JSON.parse(localStorage.getItem('slideshow_db')) || [];
            images = raw.filter(item => item.visible !== false);
            setSyncStatus('🟡 LocalStorage (offline)');
        }

        function setSyncStatus(msg) {
            syncIndicator.textContent = msg;
        }

        // ==========================================
        // SLIDESHOW
        // ==========================================

        async function initializeSlideshow() {
            const ok = await loadDataFromGitHub();
            if (!ok) loadDataFromLocalStorage();

            if (images.length > 0) {
                loadSlideData(currentSlide, imageIndex);
                startSlideshowLoop();
            } else {
                overlayText.textContent = 'No hay imágenes activas.';
            }

            // Seguimos reintentando aunque no haya imágenes al inicio: una pantalla
            // de tienda puede arrancar antes de que el internet/router esté listo.
            scheduleRefresh();
        }

        function loadSlideData(slideElement, index) {
            if (!images[index]) return;
            slideElement.src = images[index].url;
            overlayText.textContent = images[index].text || '';
        }

        function updateSlides() {
            if (images.length === 0) return;
            loadSlideData(nextSlide, imageIndex);

            nextSlide.onload = () => {
                currentSlide.classList.remove('active');
                nextSlide.classList.add('active');
                const temp = currentSlide;
                currentSlide = nextSlide;
                nextSlide = temp;
            };
        }

        function nextSlideTransition() {
            if (isPaused || images.length <= 1) return;
            imageIndex = (imageIndex + 1) % images.length;
            updateSlides();
        }

        function startSlideshowLoop() {
            stopSlideshowLoop();
            slideshowTimer = setInterval(nextSlideTransition, SLIDE_DURATION);
        }

        function stopSlideshowLoop() {
            if (slideshowTimer) clearInterval(slideshowTimer);
        }

        // Refresco periódico desde GitHub Pages.
        // Si no hay imágenes todavía, reintenta más seguido (RETRY_INTERVAL) en vez de
        // esperar los 5 minutos completos — útil cuando la pantalla arranca sin internet.
        const RETRY_INTERVAL = 15 * 1000;

        function scheduleRefresh() {
            if (refreshTimer) clearTimeout(refreshTimer);
            const wait = images.length === 0 ? RETRY_INTERVAL : REFRESH_INTERVAL;
            refreshTimer = setTimeout(async () => {
                const prevCount = images.length;
                const ok = await loadDataFromGitHub();
                if (ok && images.length !== prevCount) {
                    imageIndex = 0;
                    if (prevCount === 0 && images.length > 0) {
                        overlayText.textContent = '';
                        loadSlideData(currentSlide, imageIndex);
                        startSlideshowLoop();
                    } else {
                        updateSlides();
                    }
                }
                scheduleRefresh();
            }, wait);
        }

        // ==========================================
        // CONTROLES
        // ==========================================

        document.getElementById('btnNext').addEventListener('click', () => {
            if (images.length === 0) return;
            imageIndex = (imageIndex + 1) % images.length;
            updateSlides();
            if (!isPaused) startSlideshowLoop();
        });

        document.getElementById('btnPrev').addEventListener('click', () => {
            if (images.length === 0) return;
            imageIndex = (imageIndex - 1 + images.length) % images.length;
            updateSlides();
            if (!isPaused) startSlideshowLoop();
        });

        document.getElementById('btnPause').addEventListener('click', function() {
            isPaused = !isPaused;
            this.textContent = isPaused ? '▶ Reanudar' : '⏸ Pausar';
            this.style.background = isPaused ? 'rgba(255,0,0,0.4)' : 'rgba(255,255,255,0.15)';
            if (!isPaused) startSlideshowLoop();
            else stopSlideshowLoop();
        });

        document.getElementById('btnRotate').addEventListener('click', () => {
            isRotated = !isRotated;
            document.body.style.transform = `translate(-50%, -50%) rotate(${isRotated ? 270 : 90}deg)`;
        });

        document.getElementById('btnFull').addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
            else document.exitFullscreen?.();
        });

        // ==========================================
        // MOSTRAR CONTROLES
        // ==========================================
        let controlTimer = null;
        function showControls() {
            controls.classList.add('visible');
            if (controlTimer) clearTimeout(controlTimer);
            controlTimer = setTimeout(() => controls.classList.remove('visible'), 3000);
        }
        document.addEventListener('mousemove', showControls);
        document.addEventListener('touchstart', showControls);

        // ==========================================
        // INICIO
        // ==========================================
        window.addEventListener('load', initializeSlideshow);
    </script>
</body>
</html>
