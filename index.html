<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slideshow Vertical para TV</title>

    <style>
        html, body {
            margin: 0; padding: 0;
            overflow: hidden; background-color: #000;
        }

        body {
            width: 100vh; height: 100vw;
            position: absolute; top: 50%; left: 50%;
            transition: transform 0.5s ease-in-out;
            transform: translate(-50%, -50%) rotate(90deg);
            transform-origin: center center;
            display: flex; justify-content: center; align-items: center;
        }

        #slideshow-container { width: 100%; height: 100%; position: relative; }

        .slide {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            transition: opacity 1s ease-in-out, transform 1s ease-in-out;
            opacity: 0; transform: scale(1.0); background: #000;
        }

        .slide.active { opacity: 1; transform: scale(1.04); }

        /* La imagen o el video quedan dentro del .slide, no son el .slide */
        /* Video en modo canvas: el <video> solo decodifica, lo que se ve es el canvas */
        .slide video.video-src {
            position: absolute; top: 0; left: 0;
            width: 2px; height: 2px; opacity: 0; pointer-events: none;
        }
        .slide canvas { width: 100%; height: 100%; display: block; }

        .slide img, .slide video {
            width: 100%; height: 100%;
            object-fit: contain; object-position: center;
            display: block;
        }

        #overlayText {
            position: absolute; bottom: 3%; left: 50%;
            transform: translateX(-50%);
            color: white; text-align: center;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
            font-size: 3vh; font-family: sans-serif;
            z-index: 10; padding: 10px;
        }

        #controls {
            position: absolute; top: 2%; right: 2%;
            z-index: 60; display: flex; gap: 8px;
            opacity: 0; transition: opacity 0.35s ease;
            pointer-events: none;
        }
        #controls.visible { opacity: 1; pointer-events: auto; }

        .control-btn {
            padding: 10px 14px; border-radius: 8px; border: none;
            background: rgba(255,255,255,0.15); color: #fff;
            font-size: 2vh; backdrop-filter: blur(4px); cursor: pointer;
        }

        /* Indicador de estado de conexión */
        #syncIndicator {
            position: absolute; bottom: 2%; right: 2%;
            z-index: 60; font-size: 1.4vh; color: rgba(255,255,255,0.5);
            font-family: sans-serif;
        }

        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div id="slideshow-container">
        <div id="slide1" class="slide active"></div>
        <div id="slide2" class="slide"></div>
        <div id="overlayText"></div>
    </div>

    <div id="controls" aria-hidden="true">
        <button id="btnPrev" class="control-btn">⏮ Anterior</button>
        <button id="btnPause" class="control-btn">⏸ Pausar</button>
        <button id="btnNext" class="control-btn">Siguiente ⏭</button>
        <button id="btnRotate" class="control-btn">🔄 Girar 180°</button>
        <button id="btnFull" class="control-btn">Pantalla completa</button>
    </div>

    <div id="syncIndicator"></div>

    <script>
        // ==========================================
        // CONFIGURACIÓN
        // ==========================================

        // URL del data.json en GitHub Pages del slider
        const DATA_URL = 'https://dmg2811.github.io/pp/data.json';

        // URL de config.json (editable desde el panel, sección Configuración).
        // Si no existe o falla, se usan los valores por defecto de abajo — no
        // rompe pantallas viejas que nunca publicaron un config.json.
        const CONFIG_URL = 'https://dmg2811.github.io/pp/config.json';

        const DEFAULT_CONFIG = {
            slideDurationSeconds: 6,   // cuánto dura una IMAGEN en pantalla (el video usa su propia duración)
            refreshIntervalMinutes: 5, // cada cuánto releer data.json/config.json desde GitHub
            defaultRotationDeg: 90     // orientación inicial de una pantalla que nunca se giró a mano (90 o 270)
        };
        let CONFIG = { ...DEFAULT_CONFIG };

        // Cada cuánto refrescar los datos desde GitHub (ms). Función, no constante,
        // porque CONFIG puede cambiar después de cargar config.json.
        function refreshIntervalMs() { return CONFIG.refreshIntervalMinutes * 60 * 1000; }

        // Duración de una imagen en pantalla (ms). Un video usa su propia duración real
        // (evento 'ended'), esto solo aplica a imágenes.
        function slideDurationMs() { return CONFIG.slideDurationSeconds * 1000; }

        async function loadConfig() {
            try {
                const res = await fetch(CONFIG_URL + '?t=' + Date.now());
                if (!res.ok) return;
                const remote = await res.json();
                CONFIG = { ...DEFAULT_CONFIG, ...remote };
            } catch (e) {
                // Sin config.json publicado o sin conexión: nos quedamos con los defaults.
            }
        }

        // ==========================================
        // ESTADO
        // ==========================================
        let images = [];
        let imageIndex = 0;
        let isPaused = false;
        // Se guarda en localStorage: sin esto, cualquier recarga de la página
        // (reinicio de la TV, corte de luz, el navegador refrescando solo)
        // perdía el ajuste manual de "Girar 180°" y la pantalla volvía a
        // mostrarse de cabeza como al principio. Si esta pantalla NUNCA se
        // giró a mano, se usa el default de config.json (se resuelve luego,
        // tras cargarlo) en vez de asumir 90°.
        const storedRotation = localStorage.getItem('slider_rotated');
        let isRotated = storedRotation === null ? null : storedRotation === 'true';
        let advanceTimer = null;   // reemplaza el setInterval fijo: el tiempo varía si es video
        let refreshTimer = null;
        let endedHandler = null;   // referencia al listener 'ended' del video activo, para poder quitarlo

        const slide1 = document.getElementById('slide1');
        const slide2 = document.getElementById('slide2');
        const overlayText = document.getElementById('overlayText');
        const controls = document.getElementById('controls');
        const syncIndicator = document.getElementById('syncIndicator');

        let currentSlide = slide1;
        let nextSlide = slide2;

        // ==========================================
        // CARGA DE DATOS
        // ==========================================

        // Carga desde GitHub Pages (fuente principal)
        async function loadDataFromGitHub() {
            try {
                // Cache-buster para evitar que el navegador use versión vieja
                const res = await fetch(DATA_URL + '?t=' + Date.now());
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                images = data.filter(item => item.visible !== false);
                setSyncStatus('🟢 GitHub Pages');
                return true;
            } catch (e) {
                setSyncStatus('🔴 Sin conexión');
                return false;
            }
        }

        // Fallback: leer del localStorage (mismo dominio, uso local)
        function loadDataFromLocalStorage() {
            const raw = JSON.parse(localStorage.getItem('slideshow_db')) || [];
            images = raw.filter(item => item.visible !== false);
            setSyncStatus('🟡 LocalStorage (offline)');
        }

        function setSyncStatus(msg) {
            syncIndicator.textContent = msg;
        }

        // ==========================================
        // IMAGEN vs VIDEO
        // ==========================================
        function isVideoUrl(url) {
            return /\.(mp4|webm|mov|m4v)(\?.*)?$/i.test(url || '');
        }

        // ==========================================
        // SLIDESHOW
        // ==========================================

        // Aplicar de inmediato la orientación guardada, antes de cargar nada,
        // para no mostrar ni un instante la orientación por defecto incorrecta.
        applyRotation();

        async function initializeSlideshow() {
            const [ok] = await Promise.all([loadDataFromGitHub(), loadConfig()]);
            if (!ok) loadDataFromLocalStorage();

            // Si esta pantalla nunca se giró a mano, recién ahora sabemos el
            // default real (de config.json) — antes de esto se mostró 90°
            // de forma provisional para no tapar la carga con nada peor.
            if (isRotated === null) {
                isRotated = CONFIG.defaultRotationDeg === 270;
                applyRotation();
            }

            if (images.length > 0) {
                loadSlideData(currentSlide, imageIndex);
                scheduleNextTransition();
            } else {
                overlayText.textContent = 'No hay imágenes activas.';
            }

            // Seguimos reintentando aunque no haya imágenes al inicio: una pantalla
            // de tienda puede arrancar antes de que el internet/router esté listo.
            scheduleRefresh();
        }

        // Llena un slot (#slide1 / #slide2) con un <img> o <video> según corresponda.
        // Devuelve el elemento de medio creado (para engancharle el evento "listo").
        function loadSlideData(slideElement, index) {
            const item = images[index];
            if (!item) return null;
            slideElement.innerHTML = '';
            overlayText.textContent = item.text || '';

            let media;
            if (isVideoUrl(item.url)) {
                media = document.createElement('video');
                media.src = item.url;
                media.muted = true;              // autoplay con sonido está bloqueado en todo navegador de TV
                media.autoplay = true;
                media.playsInline = true;
                media.setAttribute('playsinline', '');
                media.setAttribute('webkit-playsinline', '');
                media.preload = 'auto';
                if (images.length <= 1) media.loop = true; // única pieza: que no se quede congelada al terminar
            } else {
                media = document.createElement('img');
                media.src = item.url;
                media.alt = item.text || '';
            }
            slideElement.appendChild(media);

            if (media.tagName === 'VIDEO' && USE_CANVAS_VIDEO) attachVideoCanvas(media, slideElement);
            return media;
        }

        // En las Smart TV de las tiendas el <video> se pinta por una capa de hardware
        // aparte que NO obedece la rotación CSS de la página (por eso se veía como
        // una franja horizontal, o de cabeza al "hornear" la rotación en el archivo).
        // Las imágenes sí la obedecen. Para que el video se comporte exactamente igual
        // que una imagen, el <video> queda oculto (solo decodifica) y cada fotograma
        // se dibuja en un <canvas>, que es un elemento normal y sí rota con la página.
        // Se puede forzar el modo anterior agregando ?video=native a la URL.
        const USE_CANVAS_VIDEO = !/[?&]video=native/.test(location.search);
        const CANVAS_MAX_SIDE = 1600; // tope de resolución interna para no ahogar TVs lentas

        function attachVideoCanvas(video, slideElement) {
            video.classList.add('video-src');
            const canvas = document.createElement('canvas');
            slideElement.appendChild(canvas);
            const ctx = canvas.getContext('2d');

            function sizeCanvas() {
                const w = slideElement.clientWidth || 1;
                const h = slideElement.clientHeight || 1;
                const k = Math.min(1, CANVAS_MAX_SIDE / Math.max(w, h));
                canvas.width = Math.round(w * k);
                canvas.height = Math.round(h * k);
            }
            sizeCanvas();

            function draw() {
                if (!video.isConnected) return; // el slide ya se reemplazó: parar
                if (!video.paused && video.videoWidth && video.videoHeight) {
                    const vw = video.videoWidth, vh = video.videoHeight;
                    const s = Math.min(canvas.width / vw, canvas.height / vh); // "contain"
                    const dw = vw * s, dh = vh * s;
                    ctx.fillStyle = '#000';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(video, (canvas.width - dw) / 2, (canvas.height - dh) / 2, dw, dh);
                }
                schedule();
            }
            function schedule() {
                if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(draw);
                else requestAnimationFrame(draw);
            }
            // Si el video está en pausa al arrancar no hay fotograma que pedir: arrancamos
            // con rAF y el propio draw() decide si dibuja.
            requestAnimationFrame(draw);
            window.addEventListener('resize', sizeCanvas);
        }

        // Si un archivo falla al cargar (borrado, 404, ruta mal escrita), no se
        // congela el slideshow para siempre en lo último que se alcanzó a ver:
        // se salta al siguiente automáticamente. skipGuard evita un loop
        // infinito si TODO el catálogo estuviera roto.
        let skipGuard = 0;

        function updateSlides() {
            if (images.length === 0) return;
            const media = loadSlideData(nextSlide, imageIndex);
            if (!media) return;

            const onReady = () => {
                skipGuard = 0;
                currentSlide.classList.remove('active');
                const outgoingVideo = currentSlide.querySelector('video');
                if (outgoingVideo) outgoingVideo.pause();

                nextSlide.classList.add('active');
                const temp = currentSlide;
                currentSlide = nextSlide;
                nextSlide = temp;

                scheduleNextTransition();
            };

            const onError = () => {
                console.warn('No se pudo cargar, se omite:', images[imageIndex]?.url);
                skipGuard++;
                if (skipGuard >= images.length) {
                    // Todo el catálogo falló: no seguir intentando en bucle cerrado.
                    skipGuard = 0;
                    overlayText.textContent = 'No se pudo cargar ninguna imagen/video.';
                    return;
                }
                imageIndex = (imageIndex + 1) % images.length;
                updateSlides(); // reintenta directo con el siguiente, sin mostrar el roto
            };

            if (media.tagName === 'VIDEO') {
                media.addEventListener('loadeddata', onReady, { once: true });
                media.addEventListener('error', onError, { once: true });
                media.play().catch(() => {}); // algunos navegadores de TV requieren play() explícito
            } else {
                media.onload = onReady;
                media.onerror = onError;
            }
        }

        function nextSlideTransition() {
            if (isPaused || images.length <= 1) return;
            imageIndex = (imageIndex + 1) % images.length;
            updateSlides();
        }

        // Programa cuándo pasar al siguiente slide: tiempo fijo para imágenes,
        // evento 'ended' (con respaldo por timeout) para videos.
        function scheduleNextTransition() {
            clearAdvanceTimer();
            if (isPaused || images.length <= 1) return;

            const video = currentSlide.querySelector('video');
            if (video) {
                endedHandler = () => nextSlideTransition();
                video.addEventListener('ended', endedHandler, { once: true });
                const durationMs = isFinite(video.duration) && video.duration > 0
                    ? video.duration * 1000
                    : slideDurationMs();
                advanceTimer = setTimeout(nextSlideTransition, durationMs + 4000); // respaldo si 'ended' no dispara
            } else {
                advanceTimer = setTimeout(nextSlideTransition, slideDurationMs());
            }
        }

        function clearAdvanceTimer() {
            if (advanceTimer) clearTimeout(advanceTimer);
            advanceTimer = null;
            if (endedHandler) {
                const video = currentSlide.querySelector('video');
                if (video) video.removeEventListener('ended', endedHandler);
                endedHandler = null;
            }
        }

        // Refresco periódico desde GitHub Pages.
        // Si no hay imágenes todavía, reintenta más seguido (RETRY_INTERVAL) en vez de
        // esperar los 5 minutos completos — útil cuando la pantalla arranca sin internet.
        const RETRY_INTERVAL = 15 * 1000;

        function scheduleRefresh() {
            if (refreshTimer) clearTimeout(refreshTimer);
            const wait = images.length === 0 ? RETRY_INTERVAL : refreshIntervalMs();
            refreshTimer = setTimeout(async () => {
                const prevCount = images.length;
                const [ok] = await Promise.all([loadDataFromGitHub(), loadConfig()]);
                if (ok && images.length !== prevCount) {
                    imageIndex = 0;
                    if (prevCount === 0 && images.length > 0) {
                        overlayText.textContent = '';
                        loadSlideData(currentSlide, imageIndex);
                        scheduleNextTransition();
                    } else {
                        updateSlides();
                    }
                }
                scheduleRefresh();
            }, wait);
        }

        // ==========================================
        // CONTROLES
        // ==========================================

        document.getElementById('btnNext').addEventListener('click', () => {
            if (images.length === 0) return;
            imageIndex = (imageIndex + 1) % images.length;
            updateSlides();
        });

        document.getElementById('btnPrev').addEventListener('click', () => {
            if (images.length === 0) return;
            imageIndex = (imageIndex - 1 + images.length) % images.length;
            updateSlides();
        });

        document.getElementById('btnPause').addEventListener('click', function() {
            isPaused = !isPaused;
            this.textContent = isPaused ? '▶ Reanudar' : '⏸ Pausar';
            this.style.background = isPaused ? 'rgba(255,0,0,0.4)' : 'rgba(255,255,255,0.15)';
            const video = currentSlide.querySelector('video');
            if (isPaused) {
                clearAdvanceTimer();
                if (video) video.pause();
            } else {
                if (video) video.play().catch(() => {});
                scheduleNextTransition();
            }
        });

        function applyRotation() {
            document.body.style.transform = `translate(-50%, -50%) rotate(${isRotated ? 270 : 90}deg)`;
        }

        document.getElementById('btnRotate').addEventListener('click', () => {
            isRotated = !isRotated;
            localStorage.setItem('slider_rotated', isRotated);
            applyRotation();
        });

        document.getElementById('btnFull').addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
            else document.exitFullscreen?.();
        });

        // ==========================================
        // MOSTRAR CONTROLES
        // ==========================================
        let controlTimer = null;
        function showControls() {
            controls.classList.add('visible');
            if (controlTimer) clearTimeout(controlTimer);
            controlTimer = setTimeout(() => controls.classList.remove('visible'), 3000);
        }
        document.addEventListener('mousemove', showControls);
        document.addEventListener('touchstart', showControls);

        // ==========================================
        // INICIO
        // ==========================================
        window.addEventListener('load', initializeSlideshow);
    </script>
</body>
</html>
